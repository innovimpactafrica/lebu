events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Masquer la version Nginx
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-XSS-Protection          "0"                                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content-Security-Policy — ajuster si des domaines tiers sont nécessaires
        add_header Content-Security-Policy "
            default-src 'self';
            script-src  'self' 'unsafe-inline' https://api.touchpay.bj https://cdnjs.cloudflare.com https://unpkg.com https://maps.googleapis.com https://touchpay.gutouch.net;
            style-src   'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
            font-src    'self' https://fonts.gstatic.com;
            img-src     'self' data: blob: https://minio.innovimpactafrica.cloud https://minio.innovimpactdev.cloud https://minio.secure.innovimpactdev.cloud https://api.qrserver.com https://maps.googleapis.com https://maps.gstatic.com https://touchpay.gutouch.net https://api.touchpay.bj;
            media-src   'self' https://minio.innovimpactafrica.cloud https://minio.innovimpactdev.cloud https://minio.secure.innovimpactdev.cloud;
            connect-src 'self' https://api.bdy.innovimpactdev.cloud https://pay.wave.com https://touchpay.gutouch.net https://api.touchpay.bj https://maps.googleapis.com https://maps.gstatic.com;
            frame-src   https://touchpay.gutouch.net;
            object-src  'none';
            base-uri    'self';
            form-action 'self';
        " always;

        # ── Routes SPA ────────────────────────────────────────────────────────
        # Proxy API calls to backend to avoid serving index.html for /api/*
        location /api/ {
            proxy_pass https://api.bdy.innovimpactdev.cloud/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_ssl_verify off;
            proxy_ssl_verify_depth 0;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Assets statiques avec cache long ─────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Répéter les security headers (add_header n'hérite pas dans les blocs location)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options        "DENY"    always;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Bloquer l'accès aux fichiers sensibles ───────────────────────────
        location ~ /\.(env|git|htaccess|DS_Store) {
            deny all;
            return 404;
        }
    }
}
