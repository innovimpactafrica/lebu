<div class="max-w-site mx-auto px-6 md:px-12" aria-hidden="true">
  <div class="flex items-center gap-4 md:gap-6">
    <span class="font-serif text-[1rem] italic text-accent transition-opacity duration-700"
      [class.opacity-0]="!visible()">{{ index() }}</span>

    <span class="h-px flex-1 origin-right bg-gradient-to-r from-transparent to-accent/40 transition-transform duration-[1400ms] ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
      [class.scale-x-0]="!visible()"></span>

    <span class="relative w-2.5 h-2.5 rotate-45 border border-accent/70 transition-all duration-700 delay-500 motion-reduce:transition-none"
      [class.opacity-0]="!visible()" [class.scale-50]="!visible()">
      <span class="absolute inset-[3px] bg-accent/70"></span>
    </span>

    <span class="h-px flex-1 origin-left bg-gradient-to-l from-transparent to-accent/40 transition-transform duration-[1400ms] ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
      [class.scale-x-0]="!visible()"></span>

    <span class="text-[0.7rem] tracking-[0.35em] uppercase text-ink/65 transition-opacity duration-700 delay-300"
      [class.opacity-0]="!visible()">{{ langService.currentLang() === 'fr' ? label().fr : label().en }}</span>
  </div>
</div>
