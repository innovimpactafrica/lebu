<section id="booking" class="relative px-6 md:px-12 box-content -mt-[50px] z-30 max-w-site mx-auto">
  <div class="bg-navy text-white border border-gold-light/20 shadow-[0_24px_60px_rgba(10,38,114,0.25)] p-6 md:p-9 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[1fr_1fr_1fr_auto] gap-6 items-end">
    
    <div class="flex flex-col gap-2.5">
      <label class="block text-[0.58rem] tracking-[0.3em] uppercase text-gold-light">
        {{ langService.currentLang() === 'fr' ? 'Arrivée' : 'Check-in' }}
      </label>
      <div class="relative">
        <input type="date" [ngModel]="checkIn" (ngModelChange)="onCheckInChange($event)" [min]="today" class="w-full bg-white/5 border border-gold-light/25 text-white font-sans text-[0.8rem] date-input pl-4 pr-11 py-3 outline-none transition-colors focus:border-gold-light appearance-none">
        <lucide-icon [img]="icons.CalendarDays" [size]="16" [strokeWidth]="1.5" class="absolute right-4 top-1/2 -translate-y-1/2 text-white pointer-events-none" aria-hidden="true"></lucide-icon>
      </div>
    </div>
    
    <div class="flex flex-col gap-2.5">
      <label class="block text-[0.58rem] tracking-[0.3em] uppercase text-gold-light">
        {{ langService.currentLang() === 'fr' ? 'Départ' : 'Check-out' }}
      </label>
      <div class="relative">
        <input type="date" [(ngModel)]="checkOut" [min]="checkIn || today" class="w-full bg-white/5 border border-gold-light/25 text-white font-sans text-[0.8rem] date-input pl-4 pr-11 py-3 outline-none transition-colors focus:border-gold-light appearance-none">
        <lucide-icon [img]="icons.CalendarDays" [size]="16" [strokeWidth]="1.5" class="absolute right-4 top-1/2 -translate-y-1/2 text-white pointer-events-none" aria-hidden="true"></lucide-icon>
      </div>
    </div>
    
    <div class="flex flex-col gap-2.5">
      <label class="block text-[0.58rem] tracking-[0.3em] uppercase text-gold-light">
        {{ langService.currentLang() === 'fr' ? 'Hébergement' : 'Accommodation' }}
      </label>
      <select [(ngModel)]="room" class="w-full bg-white/5 border border-gold-light/25 text-white font-sans text-[0.8rem] px-4 py-3 outline-none transition-colors focus:border-gold-light appearance-none [&>option]:bg-navy [&>option]:text-white [&>optgroup]:bg-navy [&>optgroup]:text-gold-light">
        <option value="">{{ langService.currentLang() === 'fr' ? 'Toutes les catégories' : 'All categories' }}</option>
        <optgroup [label]="langService.currentLang() === 'fr' ? 'Classique' : 'Classic'">
          @for (cat of classicRooms; track cat.id) {
            <option [value]="cat.id + ':classic'">{{ cat.name }} · {{ formatPrice(cat.offers.classic!.price) }} FCFA</option>
          }
        </optgroup>
        <optgroup [label]="'Club Lebu — ' + (langService.currentLang() === 'fr' ? clubFloors.fr : clubFloors.en)">
          @for (cat of clubRooms; track cat.id) {
            <option [value]="cat.id + ':club'">{{ cat.name }} Club · {{ formatPrice(cat.offers.club!.price) }} FCFA</option>
          }
        </optgroup>
      </select>
    </div>
    
    <button (click)="openBooking()" class="col-span-1 md:col-span-2 lg:col-span-1 bg-gradient-to-br from-gold-light to-gold-dark text-navy-deep border-none font-sans text-[0.65rem] font-bold tracking-[0.25em] uppercase px-9 py-3.5 cursor-pointer transition-all duration-300 whitespace-nowrap hover:-translate-y-0.5 hover:shadow-[0_8px_32px_rgba(230,196,115,0.3)]">
      {{ langService.currentLang() === 'fr' ? 'Vérifier disponibilité' : 'Check availability' }}
    </button>

  </div>
</section>
